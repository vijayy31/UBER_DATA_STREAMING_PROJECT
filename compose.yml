services:

  #--------------------------Broker1------------------------#
  kafkabroker-1:
    image: confluentinc/cp-kafka:latest 
    container_name: kafkabroker-1
    ports:
      - "9092:9092" 
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092, INTERNAL://:29092, CONTROLLER://:29093 
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://${EC2_PUBLIC_IP}:9092, INTERNAL://kafkabroker-1:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT, CONTROLLER:PLAINTEXT, EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafkabroker-1:29093, 2@kafkabroker-2:29093
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data-1:/var/lib/kafka/data 
    networks:
      - kafka-network

  #--------------------------Broker2------------------------#
  kafkabroker-2:
    image: confluentinc/cp-kafka:latest 
    container_name: kafkabroker-2
    ports:
      - "9093:9092" 
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092, INTERNAL://:29092, CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://${EC2_PUBLIC_IP}:9093, INTERNAL://kafkabroker-2:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT, CONTROLLER:PLAINTEXT, EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafkabroker-1:29093, 2@kafkabroker-2:29093
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_MIN_INSYNC_REPLICAS: 1
    volumes:
      - kafka-data-2:/var/lib/kafka/data
    networks:
      - kafka-network      
    
#-----------------Named Volume (Docker Managed Volume)
volumes:
  kafka-data-1:
  kafka-data-2:
  
networks:
  kafka-network:
    name: kafka-network
    driver: bridge
